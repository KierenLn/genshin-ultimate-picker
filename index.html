<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ultimate Genshin Picker</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/Icon_Website.png">

</head>

<body>
    <div id="main"> 
        <div id="main-grid">

        </div>
        <br><br><br>

        <div id="out-grid">
            <div id="team">
                <h3 class="special-cell-title team-text">Favorite Team</h3>
                <div id="favorite-team">
                
                </div>
            </div>
            

            <div id="special-choices">

            </div>
        </div>

        

        <div id="selection-modal" class="modal hidden">
            <div class="modal-content" id="modal-content">

                <button id="close-modal" class="close-button">
                
                    <img src="./img/UI/close.png" alt="X">
                </button>

                <h2 id="modal-title"></h2>

                <div id="character-list"></div>

            </div>
        </div>

        
        <h3 id="credits-link">kierenln.github.io/genshin-ultimate-picker</h3>
    </div>

    <br><br><br>

    <footer>
        <button id="download-grid">
        Save Image
    </button>
    </footer>

    

    


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
